# Missions: waypoints in order, with visual actions where something must be touched.
#
# Waypoints come from `bringup/waypoints.py record <name>` and live in maps/waypoints.yaml.
# They are in the ODOM frame, so they are only valid within one continuous run of the ranger
# driver -- restarting it re-zeros odom and silently invalidates every one of them.
#
# Step kinds:
#   goto: <waypoint>     drive there on odometry; the lidar vetoes a blocked corridor
#   action: <name>       run a visual action (see ACTIONS in bringup/route_run.py)
#     query: "..."       optional: what the grounder should look for
#     standoff: 60       optional: mm, measured to the flange marker
#   wait: <seconds>      hold position
#
# Waypoints are APPROXIMATE and that is fine: a leg only has to park the robot with the target in
# the camera frame. The grounder and the visual servo close the rest, to 3 mm measured.

routes:
  # The 2026-08-26 run: straight shot to the doors, sidestep to the ADA plate, press, return to
  # the doors and go through. 'doors' is visited TWICE from one recording -- the pose you park in
  # to face the doors is the same pose you come back to, so record it once.
  #
  # Why 'button' is a separate waypoint from 'doors': the ADA plate is on the wall BESIDE the
  # door. The arm reaches 0.88 m and needs the plate square in frame; a pose good for driving
  # through a doorway is neither. Park ~0.55 m off the plate's wall, square to it.
  # Recorded 2026-08-26. start -> button -> press -> finish.
  #
  # NO SEPARATE 'doors' WAYPOINT, and that is not an omission. Measured from the recordings:
  # start->button bears -98.1 deg and button->finish bears -104.0 deg -- six degrees apart, so the
  # run really is a straight shot. 'button' already sits at the doors; its yaw of -1.4 deg is the
  # robot turned ~99 deg off the direction of travel to face the wall the ADA plate is on. A
  # 'doors' pose would be the same spot with a different heading, and each extra leg is an extra
  # turn, which is where odometry on a 4WS base is worst.
  full_run:
    - goto: start
    - goto: button
    - action: press_button
      query: "the accessible door push button"
      standoff: 60
    - wait: 6
    - goto: finish

  # The 2026-08-25 scene: drive to the atrium door, press the ADA plate, wait for it, go through.
  atrium_door:
    - goto: door_approach
    - action: press_button
      query: "the accessible door push button"
      standoff: 60
    - wait: 6
    - goto: through_door

  # Smallest useful thing: drive one leg and stop. Use this to check a waypoint before
  # trusting it in a longer route.
  one_leg:
    - goto: start

  # Just the press. No transit legs -- drive to the button and act, nothing else.
  # Use this to prove the press end-to-end before trusting a multi-leg route.
  to_button:
    - goto: button
    - action: press_button
      query: "the accessible door push button"
      standoff: 60

  # THE BENCHMARK. Piloted recording happens with the doors OPEN (you just drove through them);
  # the autonomous run meets them CLOSED. So the route cannot be a fixed list -- at the doors it
  # LOOKS: a `check` step captures a frame and asks the VLM whether the way is passable.
  #   clear   -> drive straight through to 'outside'
  #   blocked -> splice in 'press_and_pass' (drive to the plate, press it, wait), then continue
  #   VLM unreachable / unparseable -> FAIL CLOSED, hold position, human decides
  # Waypoints to record, in one continuous driver session, robot piloted to each pose:
  #   start    where the run begins
  #   door     facing the doors, both leaves in the camera frame
  #   button   square to the ADA plate's wall, ~0.55 m off it (the press pose proven 2026-08-25)
  #   outside  past the doorway, where the run ends
  benchmark:
    - goto: door
    - check: blockage
      if_blocked: press_and_pass
    - goto: outside

  # The branch `benchmark` takes when the doors are shut. No leading 'goto: doors' -- the robot
  # is ALREADY at the doors when this fires, and an extra leg is an extra turn, which is where
  # 4WS odometry is worst. After the wait the doors are opening; benchmark's final leg drives
  # through while they are -- and if they never opened, the corridor veto stops on the tape.
  # THE BRANCH A REASONED TRIAL USES. No `goto button` -- that waypoint was a human pointing at
  # the control, which hollows out the grounding claim: the robot would not be FINDING the plate,
  # it would be driven to it. Instead the base closes the gap to the OBSTRUCTION geometrically
  # (no map, no waypoint, stop ~0.55 m out) and the grounder locates the control from a frame
  # taken there. approach_blockage has no idea what a button is, and must not.
  press_and_pass_visual:
    # No approach_blockage here -- escalate() now closes the gap BEFORE asking, because the
    # reasoner cannot identify a control it is too far away to see. Kept out of the branch so the
    # robot is not driven at the door twice.
    #
    # find_control sweeps the camera because the plate is on the wall BESIDE the doors and the
    # D435 is ~69 deg wide, so from a door-facing pose it is simply not in frame. It grounds every
    # view locally (~1 s each, no API), vetoes anything that reads as a fire alarm, and turns to
    # the best survivor.
    - action: find_control
      query: "the accessible door push button"
    # Then bring the CONTROL into reach. approach_blockage stops 0.55 m from the DOOR; the plate
    # is on the wall beside it, measured 2026-08-29 at 5.51 m range and +25.1 deg bearing from
    # the door-facing pose -- out of the 0.88 m arm envelope by 4.63 m. Grounding it perfectly
    # would still have reached nothing.
    - action: reach_control
      query: "the accessible door push button"
    - action: press_button
      query: "the accessible door push button"
      standoff: 60
    - wait: 6

  press_and_pass:
    - goto: button
    - action: press_button
      query: "the accessible door push button"
      standoff: 60
    - wait: 6

  # SIM twins of benchmark/press_and_pass (Isaac trial server, domain 42, UTP_SIM=1).
  # Same step kinds, same executor, same check -> the workflow is what gets tested.
  # One geometric difference: in the sim scene the button's wall FACES the robot, and the
  # straight line button->goal clips the door jamb -- so the sim branch returns to 'door'
  # before the final leg. wait is 3 s: the sim door slides open in ~2 s and never re-closes.
  benchmark_sim:
    - goto: door
    - check: blockage
      if_blocked: press_and_pass_sim
    - goto: outside

  press_and_pass_sim:
    - goto: button
    - action: press_button
      query: "the door release button on the wall"
    - wait: 3
    - goto: door
