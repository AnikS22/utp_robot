# ouster_ros driver parameters for the OS0-128. Values sourced from config/ouster.yaml, which
# documents where each one came from. Launched by bringup/lidar3d.sh.
ouster/os_driver:
  ros__parameters:
    sensor_hostname: '192.168.1.119'
    # MUST be this laptop on the sensor's subnet. The sensor was found configured to stream to
    # 192.168.1.106 -- not this machine -- while reporting "status": "RUNNING" over HTTP.
    udp_dest: '192.168.1.100'
    # 1024x10. It was dropped to 512x10 on 2026-08-30 while chasing MOLA-LO's frame rate; that
    # halved the sensor's horizontal resolution and did NOT help (1.4 Hz before and after), and
    # MOLA is no longer in the stack. Every measurement this sensor is justified by -- 977 valid
    # beams over 360 deg, the 666x779 atrium map -- was taken at 1024. pointcloud_to_laserscan is
    # also configured for ~1024 rays (angle_increment 0.0061 rad in session.sh), so at 512 half
    # the scan's bins are empty for no reason. MUST MATCH config/ouster.yaml; a test asserts it.
    lidar_mode: '512x10'
    timestamp_mode: 'TIME_FROM_ROS_TIME'
    # RNG19_RFL8_SIG16_NIR16. TRIED AND REVERTED 2026-09-01: switching to the low-data-rate
    # profile RNG15_RFL8_NIR8 made things WORSE, not better -- the driver pads its PointCloud2 to
    # a fixed layout regardless of the wire profile, and point_step went 16 -> 48 bytes, message
    # 1.05 -> 3.15 MB, /scan 6.4 -> 4.0 Hz. The UDP profile governs sensor->driver, not
    # driver->ROS. Do not retry this to save bandwidth; the throughput fix is composition.
    # RNG19_RFL8_SIG16_NIR16 -> RNG15_RFL8_NIR8 on 2026-09-04. THE CLOUD IS THE BOTTLENECK.
    # 48 B/point x 512 x 128 = 3072 KB per message. Measured the same day: /ouster/points arrives
    # at 2.66 Hz against the sensor's 10, and /scan -- the height-band projection that Nav2 and the
    # saved map both depend on -- falls to 1.79-4.4 Hz. That is ~73% of messages lost in DDS
    # transport, and it is the root cause of the 2026-09-03 failures: at ~2 Hz the scan matcher
    # cannot follow a turn, so the pose slid mid-rotation, the robot ended up 1.85 m from where
    # Nav2 reported it had arrived, and it drove into a wall.
    # RNG15_RFL8_NIR8 is 16 B/point -> 1024 KB, one third the bytes, and it drops data this stack
    # never reads: nothing here uses SIGNAL, and the 2D projection needs only range.
    # Why not simply use the driver's native /ouster/scan, which already runs at 9.9 Hz: because
    # maps/elevator.* was BUILT from the height band (min range over 0.20-1.20 m), and a single
    # ring at one elevation sees a different slice of the room. Matching a ring scan against a
    # height-band map put the robot in the wrong place. Fixing the transport keeps the map, keeps
    # the obstacle semantics, and gets the rate.
    udp_profile_lidar: 'RNG15_RFL8_NIR8'
    # The driver publishes base_link->os_sensor itself if these are left default, which would
    # place the sensor at the origin. bringup/lidar3d.sh publishes the real CAD mount pose
    # instead, so the driver is told to hang its own frames off os_sensor only.
    sensor_frame: 'os_sensor'
    lidar_frame: 'os_lidar'
    imu_frame: 'os_imu'
    point_cloud_frame: 'os_lidar'
    pub_static_tf: true
    proc_mask: 'IMU|PCL|SCAN'
    use_system_default_qos: false
