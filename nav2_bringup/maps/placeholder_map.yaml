# Placeholder occupancy map so the Nav2 stack can activate standalone (no live sim).
# The scene assembler exports real maps to runs/maps/<scene>.yaml; override the
# `map` launch arg to point there. 6 m x 6 m empty room with a 1-cell wall border.
image: placeholder_map.pgm
mode: trinary
resolution: 0.05
origin: [-3.0, -3.0, 0.0]   # places map center near (0,0); robot spawns inside
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
